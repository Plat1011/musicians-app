{% extends "base.html" %}

{% block title %}Инструменты – Музыкальное агентство{% endblock %}

{% block content %}
<h2>Инструменты</h2>

<div id="admin-tools" style="display: none;">
    <form id="add-form" class="toolbar">
        <input name="name" placeholder="Название" required minlength="1" maxlength="64">
        <input name="kind" placeholder="Вид" maxlength="32">
        <button type="submit">Добавить</button>
    </form>
    <p class="msg" id="form-msg"></p>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Вид</th>
            <th></th>
        </tr>
    </thead>
    <tbody id="instr-tbody"></tbody>
</table>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='instruments.js') }}"></script>
{% endblock %}
